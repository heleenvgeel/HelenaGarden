# Kerstmis
Ik heb kerstmis gekozen omdat het mijn favoriete feestdag van het jaar is. 
De warme, gezellige sfeer maakt het voor mij zo leuk. 
Met mijn digitale garden wil ik proberen deze nostalgische sfeer te creeren door beeld, animaties
en geluid te gebruiken.

# Content

Ik wil laten zien wat kerst voor mij zo mooi maakt. Niet alleen de versieringen en cadeautjes, maar vooral de warmte, gezelligheid, nostalgie en het samenzijn.
Met eigen kerstherinneringen, foto's en persoonlijke verhalen wil ik dit proberen over te brengen.
Daarnaast wil ik ook afbeeldingen, kerstmuziek, animaties en interactieve elementen gebruiken om dan het kerstgevoel te laten ervaren.

Wanneer de dagen korter en kouder worden, brengt kerst warmte en gezelligheid. Door de lampjes, muziek en versierigen ontstaat er een sfeer die mensen bij elkaar brengt.
