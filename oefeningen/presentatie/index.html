# Kerstmis
Ik heb kerstmis gekozen omdat het mijn favoriete feestdag van het jaar is. 
De warme, gezellige sfeer maakt het voor mij zo leuk. 
Met mijn digitale garden wil ik proberen deze nostalgische sfeer te creeren door beeld, animaties
en geluid te gebruiken.
